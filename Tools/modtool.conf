# Entertaining Ideas - the only file in Tools/ that differs between mods.
# Everything else here is shared verbatim across the SloppyMod repositories.

name      = SloppyMods Entertaining Ideas
folder    = EntertainingIdeas
namespace = EntertainingIdeas
assembly  = EntertainingIdeas
source    = Source/EntertainingIdeas
series    = 0.9

# defNames this mod owns. Lets the validator tell "a reference of ours that
# matches nothing" (a typo) from "a reference to a vanilla def".
prefix    = EI_

# <output dir> <RimWorld ref version> [compile-time defines]
# 1.6 changed APIs this mod uses - JoyUtility.JoyTickCheckEnd takes the elapsed
# tick count now, and Toil gained tickIntervalAction - so one DLL cannot serve
# both. LoadFolders.xml points each game version at its own folder.
build     = 1.5/Assemblies 1.5.4409
build     = 1.6/Assemblies 1.6.4871 RW16

# Must be in the release zip.
require   = LICENSE
require   = About/About.xml
require   = Defs
require   = LoadFolders.xml
require   = Sounds

# In the repo, but not in the release zip: the Steam page's images and text.
omit      = Workshop
omit      = docs

# Must NOT be in the release zip. This mod adds no research by design, and a
# stale def file surviving in the tree has shipped one before.
forbid    = ResearchProjectDef

# defNames owned by mods this one only patches, exempt from the vanilla check.
foreign   = Hydrotherapy
foreign   = MF_ModernFurniture
